name: Normalize PGHPoolco canonical host

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize PGHPoolco self URLs
        shell: bash
        run: |
          set -e
          mapfile -t files < <(grep -rl --include='*.html' 'https://www.pghpoolco.com/' . || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No www PGHPoolco URLs remain."
            exit 0
          fi
          printf '%s\n' "${files[@]}"
          sed -i 's#https://www\.pghpoolco\.com/#https://pghpoolco.com/#g' "${files[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Normalize PGHPoolco canonical host"
          git push